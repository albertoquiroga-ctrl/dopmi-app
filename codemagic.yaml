workflows:
  android-verify:
    name: Dopmi Android — Build and Verify
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/mobile

    environment:
      flutter: '3.47.4'
      java: 17
      android_signing:
        - dopmi_upload_2026
      groups:
        - dopmi_supabase
        - dopmi_firebase
      vars:
        PACKAGE_NAME: com.mycompany.dopmi
        RELEASE_NAME: 2.3.8

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper

    scripts:
      - name: Create runtime configuration
        script: python3 ../../scripts/write-mobile-config.py
      - name: Create Firebase configuration
        script: python3 ../../scripts/write-firebase-config.py --platform android

      - name: Install dependencies
        script: flutter pub get

      - name: Static analysis
        script: flutter analyze

      - name: Unit and widget tests
        script: flutter test

      - name: Build signed Android App Bundle
        script: |
          BUILD_NUMBER=$((PROJECT_BUILD_NUMBER + 231))
          flutter build appbundle \
            --release \
            --build-name="$RELEASE_NAME" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=DOPMI_RELEASE_NAME="$RELEASE_NAME" \
            --dart-define=DOPMI_BUILD_NUMBER="$BUILD_NUMBER" \
            --dart-define-from-file=config.json

    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - build/app/outputs/mapping/release/mapping.txt
      - flutter_drive.log

  android-internal:
    name: Dopmi Android — Internal Testing
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/mobile

    environment:
      flutter: '3.47.4'
      java: 17
      android_signing:
        - dopmi_upload_2026
      groups:
        - dopmi_supabase
        - dopmi_firebase
        - dopmi_google_play
      vars:
        PACKAGE_NAME: com.mycompany.dopmi
        RELEASE_NAME: 2.3.8

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper

    scripts:
      - name: Create runtime configuration
        script: python3 ../../scripts/write-mobile-config.py
      - name: Create Firebase configuration
        script: python3 ../../scripts/write-firebase-config.py --platform android

      - name: Install dependencies
        script: flutter pub get

      - name: Static analysis
        script: flutter analyze

      - name: Unit and widget tests
        script: flutter test

      - name: Build signed Android App Bundle
        script: |
          BUILD_NUMBER=$((PROJECT_BUILD_NUMBER + 231))
          flutter build appbundle \
            --release \
            --build-name="$RELEASE_NAME" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=DOPMI_RELEASE_NAME="$RELEASE_NAME" \
            --dart-define=DOPMI_BUILD_NUMBER="$BUILD_NUMBER" \
            --dart-define-from-file=config.json

    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - build/app/outputs/mapping/release/mapping.txt
      - flutter_drive.log

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false

  android-guardian-internal: &android-signed-release
    name: Dopmi Guardián — Google Play Internal Testing
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/mobile

    environment: &android-signed-environment
      flutter: '3.47.4'
      java: 17
      android_signing:
        - dopmi_upload_2026
      groups:
        - dopmi_supabase
        - dopmi_firebase
        - dopmi_google_play
      vars: &android-signed-vars
        PACKAGE_NAME: com.mycompany.dopmi
        RELEASE_NAME: 2.3.8

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper

    scripts:
      - name: Create explicit Guardian environment configuration
        script: |
          set -euo pipefail
          case "${DOPMI_ANDROID_META_ADS_MEASUREMENT-false}" in
            true) set -- --meta-ads-measurement ;;
            false) set -- ;;
            *) echo "Unknown Android Meta ads measurement setting." >&2; exit 1 ;;
          esac
          case "${DOPMI_META_LIFECYCLE_ENABLED-false}" in
            true) set -- "$@" --meta-lifecycle ;;
            false) ;;
            *) echo "Unknown Meta lifecycle setting." >&2; exit 1 ;;
          esac
          case "${DOPMI_ENVIRONMENT:-test}:${DOPMI_ADOPTION_ONLY-false}:${DOPMI_STORE_REVIEW-false}:${DOPMI_STORE_AMAZON_PUBLIC-false}" in
            test:false:false:false) python3 ../../scripts/write-mobile-config.py --guardian-test --measurement-test "$@" ;;
            production:false:false:false) python3 ../../scripts/write-mobile-config.py --production-beta "$@" ;;
            production:true:false:false) python3 ../../scripts/write-mobile-config.py --production-beta --adoption-only "$@" ;;
            production:true:true:false) python3 ../../scripts/write-mobile-config.py --production-beta --adoption-only --store-review "$@" ;;
            production:true:false:true) python3 ../../scripts/write-mobile-config.py --production-beta --adoption-only --store-amazon-public "$@" ;;
            *) echo "Unknown Dopmi mobile build profile." >&2; exit 1 ;;
          esac
      - name: Create matching Guardian Firebase configuration
        script: &android-signed-firebase |
          set -euo pipefail
          case "${DOPMI_ENVIRONMENT:-test}" in
            test) python3 ../../scripts/write-firebase-config.py --platform android ;;
            production) python3 ../../scripts/write-firebase-config.py --production-beta --platform android ;;
            *) echo "Unknown Dopmi build environment." >&2; exit 1 ;;
          esac
      - name: Configure native Google Maps
        script: &android-signed-maps |
          set -euo pipefail
          python3 ../../scripts/write-maps-config.py --platform android
      - name: Install dependencies
        script: &android-signed-dependencies flutter pub get
      - name: Static analysis
        script: &android-signed-analysis flutter analyze
      - name: Unit and widget tests
        script: &android-signed-tests flutter test
      - name: Build signed Guardian Android App Bundle
        script: &android-signed-bundle |
          set -euo pipefail
          # Play uses the existing application ID, never the standalone APK suffix.
          unset DOPMI_GUARDIAN_ACCEPTANCE_BUILD
          BUILD_NUMBER=$((PROJECT_BUILD_NUMBER + 231))
          flutter build appbundle \
            --release \
            --build-name="$RELEASE_NAME" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=DOPMI_RELEASE_NAME="$RELEASE_NAME" \
            --dart-define=DOPMI_BUILD_NUMBER="$BUILD_NUMBER" \
            --dart-define-from-file=config.json
          python3 - "$BUILD_NUMBER" <<'PYINFO'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          from urllib.parse import urlsplit
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          config = json.loads(Path('config.json').read_text())
          backend = urlsplit(config['SUPABASE_URL']).hostname
          project = backend.split('.')[0]
          firebase_android_bytes = Path('android/app/google-services.json').read_bytes()
          firebase_ios_bytes = Path('ios/Runner/GoogleService-Info.plist').read_bytes()
          firebase_android = json.loads(firebase_android_bytes)
          firebase_client = next(client for client in firebase_android['client']
              if client['client_info']['android_client_info']['package_name'] == 'com.mycompany.dopmi')
          distribution = ('Google Play production'
              if os.environ.get('DOPMI_PLAY_PRODUCTION_SUBMISSION') == 'true'
              else 'Google Play internal')
          Path('build/guardian-build-info.txt').write_text(
              f"Commit: {sha}\nVersion: {os.environ['RELEASE_NAME']} ({sys.argv[1]})\n"
              f"Environment: {config['DOPMI_ENVIRONMENT']}\n"
              f"Backend: {backend}\nProject: {project}\n"
              f"Adoption only: {config['DOPMI_ADOPTION_ONLY']}\n"
              f"Store review: {config['DOPMI_STORE_REVIEW']}\n"
              f"Amazon Store public: {config['DOPMI_STORE_AMAZON_PUBLIC']}\n"
              f"Guardian: {config['ENABLE_GUARDIAN']}\n"
              f"Stripe live client: {str(bool(config['STRIPE_PUBLISHABLE_KEY'])).lower()}\n"
              f"Guardian test: {config['ENABLE_GUARDIAN_TEST']}\n"
              f"Measurement test: {config['ENABLE_MEASUREMENT_TEST']}\n"
              f"Meta ads measurement: {config['ENABLE_META_ADS_MEASUREMENT']}\n"
              f"Meta lifecycle: {config['META_LIFECYCLE_ENABLED']}\n"
              f"Meta app: {config['META_APP_ID']}\n"
              f"Native wallets test: {config['ENABLE_NATIVE_WALLETS_TEST']}\n"
              f"Firebase project: {firebase_android['project_info']['project_id']}\n"
              f"Firebase Android app: {firebase_client['client_info']['mobilesdk_app_id']}\n"
              f"Firebase Android config SHA256: {hashlib.sha256(firebase_android_bytes).hexdigest()}\n"
              f"Firebase iOS config SHA256: {hashlib.sha256(firebase_ios_bytes).hexdigest()}\n"
              f"Distribution: {distribution}\n", encoding='utf-8')
          PYINFO

    artifacts:
      - build/guardian-build-info.txt
      - build/app/outputs/bundle/release/app-release.aab
      - build/app/outputs/mapping/release/mapping.txt

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false

  android-play-production:
    <<: *android-signed-release
    name: Dopmi Android — Google Play Production
    environment:
      <<: *android-signed-environment
      vars:
        <<: *android-signed-vars
        DOPMI_PLAY_PRODUCTION_SUBMISSION: 'true'
        DOPMI_ENVIRONMENT: production
        DOPMI_ADOPTION_ONLY: 'true'
        DOPMI_STORE_REVIEW: 'false'
        DOPMI_STORE_AMAZON_PUBLIC: 'true'

    scripts:
      - name: Require the public Amazon adoption profile
        script: |
          set -euo pipefail
          if [ "${GOOGLE_PLAY_TRACK:-production}" != production ]; then
            echo "This workflow can only publish to the Google Play production track." >&2
            exit 1
          fi
          PROFILE="${DOPMI_ENVIRONMENT:-test}:${DOPMI_ADOPTION_ONLY-false}:${DOPMI_STORE_REVIEW-false}:${DOPMI_STORE_AMAZON_PUBLIC-false}"
          if [ "${DOPMI_PLAY_PRODUCTION_SUBMISSION:-false}" != true ] || [ "$PROFILE" != production:true:false:true ]; then
            echo "Google Play production requires the public Amazon adoption profile." >&2
            exit 1
          fi
          case "${DOPMI_ANDROID_META_ADS_MEASUREMENT-false}" in
            true) set -- --meta-ads-measurement ;;
            false) set -- ;;
            *) echo "Unknown Android Meta ads measurement setting." >&2; exit 1 ;;
          esac
          case "${DOPMI_META_LIFECYCLE_ENABLED-false}" in
            true) set -- "$@" --meta-lifecycle ;;
            false) ;;
            *) echo "Unknown Meta lifecycle setting." >&2; exit 1 ;;
          esac
          python3 ../../scripts/write-mobile-config.py --production-beta --adoption-only --store-amazon-public "$@"
      - name: Create matching Guardian Firebase configuration
        script: *android-signed-firebase
      - name: Configure native Google Maps
        script: *android-signed-maps
      - name: Install dependencies
        script: *android-signed-dependencies
      - name: Static analysis
        script: *android-signed-analysis
      - name: Unit and widget tests
        script: *android-signed-tests
      - name: Build signed Android App Bundle
        script: *android-signed-bundle

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: production
        submit_as_draft: false

  ios-verify:
    name: Dopmi iOS — Build and Verify
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/mobile

    integrations:
      app_store_connect: dopmi_app_store

    environment:
      flutter: '3.47.4'
      xcode: latest
      groups:
        - dopmi_supabase
        - dopmi_firebase
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mycompany.dopmi
      vars:
        BUNDLE_ID: com.mycompany.dopmi
        RELEASE_NAME: 2.3.8
        BYPASS_PERMISSION_LOCATION_ALWAYS: '1'

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Create runtime configuration
        script: python3 ../../scripts/write-mobile-config.py
      - name: Create Firebase configuration
        script: python3 ../../scripts/write-firebase-config.py --platform ios

      - name: Install dependencies
        script: flutter pub get

      - name: Static analysis
        script: flutter analyze

      - name: Unit and widget tests
        script: flutter test

      - name: Set up iOS code signing
        script: xcode-project use-profiles

      - name: Build signed IPA
        script: |
          set -euo pipefail
          BUILD_NUMBER=$((PROJECT_BUILD_NUMBER + 231))
          flutter build ipa \
            --release \
            --build-name="$RELEASE_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=DOPMI_RELEASE_NAME="$RELEASE_NAME" \
            --dart-define=DOPMI_BUILD_NUMBER="$BUILD_NUMBER" \
            --dart-define-from-file=config.json
          IPA_PATH="$(find "$CM_BUILD_DIR/apps/mobile/build/ios/ipa" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA was generated. Files under build/ios:"
            find "$CM_BUILD_DIR/apps/mobile/build/ios" -maxdepth 4 -type f -print
            exit 1
          fi
          python3 ../../scripts/verify-ios-foreground-location.py --app "$CM_BUILD_DIR/apps/mobile/build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          echo "IPA ready for publishing: $IPA_PATH"

    artifacts:
      - $CM_BUILD_DIR/apps/mobile/build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/apps/mobile/build/ios/archive/Runner.xcarchive/dSYMs/**/*.dSYM

  ios-testflight: &ios-signed-release
    name: Dopmi iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/mobile

    integrations:
      app_store_connect: dopmi_app_store

    environment: &ios-signed-environment
      flutter: '3.47.4'
      xcode: latest
      groups:
        - dopmi_supabase
        - dopmi_firebase
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mycompany.dopmi
      vars: &ios-signed-vars
        BUNDLE_ID: com.mycompany.dopmi
        RELEASE_NAME: 2.3.8
        BYPASS_PERMISSION_LOCATION_ALWAYS: '1'

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Create runtime configuration
        script: |
          set -euo pipefail
          set --
          case "${DOPMI_META_LIFECYCLE_ENABLED-false}" in
            true) set -- --meta-lifecycle ;;
            false) ;;
            *) echo "Unknown Meta lifecycle setting." >&2; exit 1 ;;
          esac
          PROFILE="${DOPMI_ENVIRONMENT:-test}:${DOPMI_ADOPTION_ONLY-false}:${DOPMI_STORE_REVIEW-false}:${DOPMI_STORE_AMAZON_PUBLIC-false}"
          case "$PROFILE" in
            test:false:false:false) python3 ../../scripts/write-mobile-config.py --guardian-test --measurement-test "$@" ;;
            production:false:false:false) python3 ../../scripts/write-mobile-config.py --production-beta "$@" ;;
            production:true:false:false) python3 ../../scripts/write-mobile-config.py --production-beta --adoption-only "$@" ;;
            production:true:false:true) python3 ../../scripts/write-mobile-config.py --production-beta --adoption-only --store-amazon-public "$@" ;;
            *) echo "Unknown Dopmi mobile build profile." >&2; exit 1 ;;
          esac
      - name: Create Firebase configuration
        script: &ios-signed-firebase |
          set -euo pipefail
          case "${DOPMI_ENVIRONMENT:-test}" in
            test) python3 ../../scripts/write-firebase-config.py --platform ios ;;
            production) python3 ../../scripts/write-firebase-config.py --production-beta --platform ios ;;
            *) echo "Unknown Dopmi build environment." >&2; exit 1 ;;
          esac

      - name: Configure native Google Maps
        script: &ios-signed-maps |
          set -euo pipefail
          python3 ../../scripts/write-maps-config.py --platform ios
      - name: Install dependencies
        script: &ios-signed-dependencies flutter pub get

      - name: Static analysis
        script: &ios-signed-analysis flutter analyze

      - name: Unit and widget tests
        script: &ios-signed-tests flutter test

      - name: Set up iOS code signing
        script: &ios-signed-signing |
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": false}'

      - name: Build signed IPA
        script: &ios-signed-ipa |
          set -euo pipefail
          BUILD_NUMBER=$((PROJECT_BUILD_NUMBER + 231))
          flutter build ipa \
            --release \
            --build-name="$RELEASE_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=DOPMI_RELEASE_NAME="$RELEASE_NAME" \
            --dart-define=DOPMI_BUILD_NUMBER="$BUILD_NUMBER" \
            --dart-define-from-file=config.json
          IPA_PATH="$(find "$CM_BUILD_DIR/apps/mobile/build/ios/ipa" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA was generated. Files under build/ios:"
            find "$CM_BUILD_DIR/apps/mobile/build/ios" -maxdepth 4 -type f -print
            exit 1
          fi
          python3 ../../scripts/verify-ios-foreground-location.py --ipa "$IPA_PATH"
          echo "IPA ready for publishing: $IPA_PATH"
          python3 - "$BUILD_NUMBER" <<'PYINFO'
          import json, os, subprocess, sys
          from pathlib import Path
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          configuration = json.loads(Path('config.json').read_text())
          distribution = ('App Store submission'
              if os.environ.get('DOPMI_APP_STORE_SUBMISSION') == 'true'
              else 'TestFlight (external eligible)')
          Path('build/guardian-build-info.txt').write_text(
              f"Commit: {sha}\nVersion: {os.environ['RELEASE_NAME']} ({sys.argv[1]})\n"
              f"Environment: {configuration['DOPMI_ENVIRONMENT']}\n"
              f"Adoption only: {configuration['DOPMI_ADOPTION_ONLY']}\n"
              f"Store review: {configuration['DOPMI_STORE_REVIEW']}\n"
              f"Amazon Store public: {configuration['DOPMI_STORE_AMAZON_PUBLIC']}\n"
              f"Guardian: {configuration['ENABLE_GUARDIAN']}\n"
              f"Stripe live client: {str(bool(configuration['STRIPE_PUBLISHABLE_KEY'])).lower()}\n"
              f"Guardian test: {configuration['ENABLE_GUARDIAN_TEST']}\n"
              f"Meta lifecycle: {configuration['META_LIFECYCLE_ENABLED']}\n"
              f"Meta app: {configuration['META_APP_ID']}\n"
              f"Distribution: {distribution}\n")
          PYINFO

    artifacts:
      - $CM_BUILD_DIR/apps/mobile/build/guardian-build-info.txt
      - $CM_BUILD_DIR/apps/mobile/build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/apps/mobile/build/ios/archive/Runner.xcarchive/dSYMs/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        # Upload an external-eligible build; beta review is handled in App Store Connect.
        submit_to_testflight: false
        submit_to_app_store: false

  ios-app-store:
    <<: *ios-signed-release
    name: Dopmi iOS — App Store
    environment:
      <<: *ios-signed-environment
      vars:
        <<: *ios-signed-vars
        DOPMI_APP_STORE_SUBMISSION: 'true'
        DOPMI_ENVIRONMENT: production
        DOPMI_ADOPTION_ONLY: 'true'
        DOPMI_STORE_REVIEW: 'false'
        DOPMI_STORE_AMAZON_PUBLIC: 'false'
    scripts:
      - name: Require the App Store adoption profile
        script: |
          set -euo pipefail
          set --
          case "${DOPMI_META_LIFECYCLE_ENABLED-false}" in
            true) set -- --meta-lifecycle ;;
            false) ;;
            *) echo "Unknown Meta lifecycle setting." >&2; exit 1 ;;
          esac
          PROFILE="${DOPMI_APP_STORE_SUBMISSION-false}:${DOPMI_ENVIRONMENT:-test}:${DOPMI_ADOPTION_ONLY-false}:${DOPMI_STORE_REVIEW-false}:${DOPMI_STORE_AMAZON_PUBLIC-false}"
          case "$PROFILE" in
            true:production:true:false:false) python3 ../../scripts/write-mobile-config.py --production-beta --adoption-only "$@" ;;
            true:production:true:false:true) python3 ../../scripts/write-mobile-config.py --production-beta --adoption-only --store-amazon-public "$@" ;;
            *) echo "The App Store workflow requires the production adoption profile." >&2; exit 1 ;;
          esac
      - name: Create Firebase configuration
        script: *ios-signed-firebase
      - name: Configure native Google Maps
        script: *ios-signed-maps
      - name: Install dependencies
        script: *ios-signed-dependencies
      - name: Static analysis
        script: *ios-signed-analysis
      - name: Unit and widget tests
        script: *ios-signed-tests
      - name: Set up iOS code signing
        script: *ios-signed-signing
      - name: Build signed IPA
        script: *ios-signed-ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: true
        cancel_previous_submissions: false
        release_type: AFTER_APPROVAL
