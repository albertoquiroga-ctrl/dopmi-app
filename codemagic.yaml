workflows:
  android-verify:
    name: Dopmi Android — Build and Verify
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/mobile

    environment:
      flutter: stable
      java: 17
      android_signing:
        - dopmi_upload_2026
      groups:
        - dopmi_supabase
      vars:
        PACKAGE_NAME: com.mycompany.dopmi
        RELEASE_NAME: 2.3.3

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper

    scripts:
      - name: Create runtime configuration
        script: python3 ../../scripts/write-mobile-config.py

      - name: Install dependencies
        script: flutter pub get

      - name: Static analysis
        script: flutter analyze

      - name: Unit and widget tests
        script: flutter test

      - name: Build signed Android App Bundle
        script: |
          BUILD_NUMBER=$((PROJECT_BUILD_NUMBER + 226))
          flutter build appbundle \
            --release \
            --build-name="$RELEASE_NAME" \
            --build-number="$BUILD_NUMBER" \
            --dart-define-from-file=config.json

    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - build/app/outputs/mapping/release/mapping.txt
      - flutter_drive.log

  android-internal:
    name: Dopmi Android — Internal Testing
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/mobile

    environment:
      flutter: stable
      java: 17
      android_signing:
        - dopmi_upload_2026
      groups:
        - dopmi_supabase
        - dopmi_google_play
      vars:
        PACKAGE_NAME: com.mycompany.dopmi
        RELEASE_NAME: 2.3.3

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper

    scripts:
      - name: Create runtime configuration
        script: python3 ../../scripts/write-mobile-config.py

      - name: Install dependencies
        script: flutter pub get

      - name: Static analysis
        script: flutter analyze

      - name: Unit and widget tests
        script: flutter test

      - name: Build signed Android App Bundle
        script: |
          BUILD_NUMBER=$((PROJECT_BUILD_NUMBER + 226))
          flutter build appbundle \
            --release \
            --build-name="$RELEASE_NAME" \
            --build-number="$BUILD_NUMBER" \
            --dart-define-from-file=config.json

    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - build/app/outputs/mapping/release/mapping.txt
      - flutter_drive.log

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false

  android-guardian-internal:
    name: Dopmi Guardián — Google Play Internal Testing
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/mobile

    environment:
      flutter: '3.47.4'
      java: 17
      android_signing:
        - dopmi_upload_2026
      groups:
        - dopmi_supabase
        - dopmi_google_play
      vars:
        PACKAGE_NAME: com.mycompany.dopmi
        RELEASE_NAME: 2.3.3

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper

    scripts:
      - name: Create Guardian test configuration
        script: python3 ../../scripts/write-mobile-config.py --guardian-test
      - name: Install dependencies
        script: flutter pub get
      - name: Static analysis
        script: flutter analyze
      - name: Unit and widget tests
        script: flutter test
      - name: Build signed Guardian Android App Bundle
        script: |
          set -euo pipefail
          # Play uses the existing application ID, never the standalone APK suffix.
          unset DOPMI_GUARDIAN_ACCEPTANCE_BUILD
          BUILD_NUMBER=$((PROJECT_BUILD_NUMBER + 231))
          flutter build appbundle \
            --release \
            --build-name="$RELEASE_NAME" \
            --build-number="$BUILD_NUMBER" \
            --dart-define-from-file=config.json
          python3 - "$BUILD_NUMBER" <<'PYINFO'
          import os, subprocess, sys
          from pathlib import Path
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          Path('build/guardian-build-info.txt').write_text(
              f"Commit: {sha}\nVersion: {os.environ['RELEASE_NAME']} ({sys.argv[1]})\n"
              "Guardian test: true\nDistribution: Google Play internal\n")
          PYINFO

    artifacts:
      - build/guardian-build-info.txt
      - build/app/outputs/bundle/release/app-release.aab
      - build/app/outputs/mapping/release/mapping.txt

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false

  ios-verify:
    name: Dopmi iOS — Build and Verify
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/mobile

    integrations:
      app_store_connect: dopmi_app_store

    environment:
      flutter: stable
      xcode: latest
      groups:
        - dopmi_supabase
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mycompany.dopmi
      vars:
        BUNDLE_ID: com.mycompany.dopmi
        RELEASE_NAME: 2.3.3

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Create runtime configuration
        script: python3 ../../scripts/write-mobile-config.py

      - name: Install dependencies
        script: flutter pub get

      - name: Static analysis
        script: flutter analyze

      - name: Unit and widget tests
        script: flutter test

      - name: Set up iOS code signing
        script: xcode-project use-profiles

      - name: Build signed IPA
        script: |
          BUILD_NUMBER=$((PROJECT_BUILD_NUMBER + 231))
          flutter build ipa \
            --release \
            --build-name="$RELEASE_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define-from-file=config.json
          IPA_PATH="$(find "$CM_BUILD_DIR/apps/mobile/build/ios/ipa" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA was generated. Files under build/ios:"
            find "$CM_BUILD_DIR/apps/mobile/build/ios" -maxdepth 4 -type f -print
            exit 1
          fi
          echo "IPA ready for publishing: $IPA_PATH"

    artifacts:
      - $CM_BUILD_DIR/apps/mobile/build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/apps/mobile/build/ios/archive/Runner.xcarchive/dSYMs/**/*.dSYM

  ios-testflight:
    name: Dopmi iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/mobile

    integrations:
      app_store_connect: dopmi_app_store

    environment:
      flutter: '3.47.4'
      xcode: latest
      groups:
        - dopmi_supabase
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mycompany.dopmi
      vars:
        BUNDLE_ID: com.mycompany.dopmi
        RELEASE_NAME: 2.3.3

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Create runtime configuration
        script: python3 ../../scripts/write-mobile-config.py --guardian-test

      - name: Install dependencies
        script: flutter pub get

      - name: Static analysis
        script: flutter analyze

      - name: Unit and widget tests
        script: flutter test

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'

      - name: Build signed IPA
        script: |
          set -euo pipefail
          BUILD_NUMBER=$((PROJECT_BUILD_NUMBER + 231))
          flutter build ipa \
            --release \
            --build-name="$RELEASE_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define-from-file=config.json
          IPA_PATH="$(find "$CM_BUILD_DIR/apps/mobile/build/ios/ipa" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA was generated. Files under build/ios:"
            find "$CM_BUILD_DIR/apps/mobile/build/ios" -maxdepth 4 -type f -print
            exit 1
          fi
          echo "IPA ready for publishing: $IPA_PATH"
          python3 - "$BUILD_NUMBER" <<'PYINFO'
          import os, subprocess, sys
          from pathlib import Path
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          Path('build/guardian-build-info.txt').write_text(
              f"Commit: {sha}\nVersion: {os.environ['RELEASE_NAME']} ({sys.argv[1]})\n"
              "Guardian test: true\nDistribution: TestFlight internal\n")
          PYINFO

    artifacts:
      - $CM_BUILD_DIR/apps/mobile/build/guardian-build-info.txt
      - $CM_BUILD_DIR/apps/mobile/build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/apps/mobile/build/ios/archive/Runner.xcarchive/dSYMs/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        # Upload for internal testers; do not request external beta review.
        submit_to_testflight: false
        submit_to_app_store: false
