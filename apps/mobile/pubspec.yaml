name: dopmi_mobile
description: Dopmi — identidad, adopción y comunicación.
publish_to: none
version: 0.2.0+2
environment:
  sdk: ^3.13.3
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  supabase_flutter: ^2.17.2
  flutter_secure_storage: ^11.1.1
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  image: ^4.10.1
  uuid: ^4.6.0
  file_selector: ^1.1.0
  url_launcher: ^6.3.2
  flutter_svg: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/dopmi-wordmark.png
    - assets/welcome-pets.png
    - assets/navigation/
    - assets/onboarding/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
