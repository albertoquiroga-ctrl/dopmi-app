name: dopmi_mobile
description: Dopmi — identidad, adopción y comunicación.
publish_to: none
version: 0.2.0+2
environment:
  sdk: ^3.13.3
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  supabase_flutter: ^2.17.2
  flutter_secure_storage: ^11.1.1
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  video_player: 2.14.1
  image: ^4.10.1
  uuid: ^4.6.0
  file_selector: ^1.1.0
  url_launcher: ^6.3.2
  share_plus: ^13.3.1
  app_links: ^7.2.1
  flutter_svg: ^2.3.0
  geolocator: ^14.0.3
  # First Apple release that applies the foreground-only bypass in Swift Package Manager.
  geolocator_apple: 2.3.15
  google_sign_in: 7.2.0
  sign_in_with_apple: 8.2.0
  crypto: 3.0.7
  flutter_cache_manager: 3.4.5
  http: 1.6.0
  path_provider: 2.1.6
  file: 7.0.1
  flutter_stripe: 14.2.0
  firebase_core: ^4.15.0
  firebase_analytics: ^12.6.0
  firebase_crashlytics: ^5.4.0
  flutter_stripe_connect: 0.5.0
  google_maps_flutter: 2.19.0
  google_maps_flutter_ios_sdk9: 2.19.0
  geocoding: 5.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  google_sign_in_platform_interface: 3.1.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/canvas-grain-f693.png
    - assets/dopmi-wordmark.png
    - assets/welcome-pets.png
    - assets/navigation/
    - assets/profile/
    - assets/store/store-home.png
    - assets/store/review-packshot.png
    - assets/store/review-photos/
    - assets/onboarding/
    - assets/guardian/
    - assets/guardian/bubbles/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
