name: Dopmi identity and adoption
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dopmi-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-and-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/admin/package-lock.json
            tools/verification/package-lock.json
      - run: npm ci && npm test && npm run build
      - run: npm ci && npm test && npm run build
        working-directory: apps/admin
      - run: npm ci && npm test
        working-directory: tools/verification
      - name: Start local PostgreSQL with the actual migration
        run: tools/verification/node_modules/.bin/supabase db start
      - name: Supabase permissions tests
        run: tools/verification/node_modules/.bin/supabase test db
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - run: dart format --output=none --set-exit-if-changed lib test test_backend
        working-directory: apps/mobile
      - run: flutter analyze && flutter test
        working-directory: apps/mobile
      - name: Android development build (no production credentials)
        run: flutter build apk --debug --dart-define-from-file=config.example.json
        working-directory: apps/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: dopmi-android-development
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - name: iOS simulator compilation (device signing is separate)
        run: flutter build ios --simulator --no-codesign --dart-define-from-file=config.example.json
        working-directory: apps/mobile
  identity-and-adoption-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/verification/package-lock.json
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: npm ci
        working-directory: tools/verification
      - name: Start local Auth, PostgreSQL, Storage, Realtime and test mail
        run: tools/verification/node_modules/.bin/supabase start --exclude imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Prepare temporary local test configuration
        run: tools/verification/node_modules/.bin/supabase status --output json > "$RUNNER_TEMP/supabase-status.json"
      - run: flutter pub get
        working-directory: apps/mobile
      - name: Identity, adoption moderation, private photos and messaging
        env:
          DOPMI_LOCAL_CONFIG: ${{ runner.temp }}/supabase-status.json
        run: flutter test test_backend --reporter expanded --concurrency=1
        working-directory: apps/mobile
      - name: Stop disposable services
        if: always()
        run: tools/verification/node_modules/.bin/supabase stop --no-backup
