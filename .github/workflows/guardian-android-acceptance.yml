name: Build connected Guardian Android test app

on:
  workflow_dispatch:
  push:
    branches:
      - codex/stripe-transfer-delivery
    paths:
      - .github/workflows/guardian-android-acceptance.yml

permissions:
  contents: read

concurrency:
  group: dopmi-guardian-android-acceptance
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: h4-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 21
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Prepare an ignored config using only the existing publishable key
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          task_keys="$RUNNER_TEMP/dopmi-key-metadata.json"
          trap 'rm -f "$task_keys"' EXIT
          # Never use --reveal, log the response, or include a server key in Flutter.
          supabase projects api-keys --project-ref ohqxranynackjignryep --output json > "$task_keys"
          python - "$task_keys" <<'PY'
          import json, re, sys
          from pathlib import Path
          entries = json.loads(Path(sys.argv[1]).read_text())
          if not isinstance(entries, list):
              raise SystemExit('Unexpected key metadata format; no data printed.')
          keys = [item.get('api_key', '') for item in entries
                  if item.get('type') == 'publishable' and item.get('name') == 'default'
                  and not item.get('disabled')]
          if len(keys) != 1 or not re.fullmatch(r'sb_publishable_[A-Za-z0-9_-]+', keys[0]):
              raise SystemExit('One enabled default publishable key is required.')
          config = json.loads(Path('apps/mobile/config.example.json').read_text())
          assert config['SUPABASE_URL'] == 'https://ohqxranynackjignryep.supabase.co'
          config.update(SUPABASE_PUBLISHABLE_KEY=keys[0], ENABLE_GUARDIAN_TEST='true')
          Path('apps/mobile/config.local.json').write_text(json.dumps(config))
          print('Temporary client configuration ready; server checkout gate is unchanged.')
          PY
          git check-ignore --quiet apps/mobile/config.local.json
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - name: Build test APKs for device and emulator
        run: flutter build apk --debug --split-per-abi --dart-define-from-file=config.local.json
        working-directory: apps/mobile
      - name: Record APK integrity
        shell: bash
        run: |
          cd apps/mobile/build/app/outputs/flutter-apk
          sha256sum app-*-debug.apk > SHA256SUMS.txt
          printf '%s\n' "$GITHUB_SHA" > COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dopmi-guardian-test-android
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-*-debug.apk
            apps/mobile/build/app/outputs/flutter-apk/SHA256SUMS.txt
            apps/mobile/build/app/outputs/flutter-apk/COMMIT.txt
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary client configuration
        if: always()
        run: rm -f apps/mobile/config.local.json
