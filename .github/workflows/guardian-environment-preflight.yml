name: Check Guardian test environment

on:
  workflow_dispatch:
  push:
    branches:
      - codex/stripe-transfer-delivery
    paths:
      - .github/workflows/guardian-environment-preflight.yml

permissions:
  contents: read

concurrency:
  group: dopmi-guardian-environment-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: h4-test
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Verify existing deployment access without changing configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo '::error::The existing h4-test deployment token is unavailable.'
            exit 1
          fi
          task_secrets="$RUNNER_TEMP/dopmi-secret-metadata.json"
          trap 'rm -f "$task_secrets"' EXIT
          supabase secrets list --project-ref ohqxranynackjignryep --output json > "$task_secrets"
          python - "$task_secrets" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as source:
              entries = json.load(source)
          if not isinstance(entries, list):
              raise SystemExit('Unexpected secrets metadata format; no data printed.')
          names = {item.get('name') for item in entries if isinstance(item, dict)}
          required = ['STRIPE_SECRET_KEY_H4_TEST', 'STRIPE_WEBHOOK_SECRET_H4_TEST', 'DOPMI_WORKER_SECRET']
          missing = [name for name in required if name not in names]
          for name in required:
              print(f'{name}: {"present" if name in names else "missing"}')
          if missing:
              raise SystemExit('Required test configuration is incomplete.')
          print('Existing deployment access verified; flags and credentials unchanged.')
          print('Secret presence does not verify key permissions, key contents or enabled flags.')
          PY
